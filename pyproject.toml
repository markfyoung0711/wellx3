[project]
name = "wellx3"
version = "0.1.0"
description = "East Texas oil well data analysis pipeline"
requires-python = ">=3.12"

dependencies = [
    "kaggle",
    "jupyterlab",
    "pandas",
    "numpy",
    "geopandas",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "lxml",
    "selenium",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
py-modules = ["build", "gsa020_to_csv"]
packages = ["rrc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]
